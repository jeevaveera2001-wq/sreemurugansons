<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E3B24" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="500" height="380" rx="16" fill="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="76" x2="500" y2="76" />
    <line x1="0" y1="152" x2="500" y2="152" />
    <line x1="0" y1="228" x2="500" y2="228" />
    <line x1="0" y1="304" x2="500" y2="304" />
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
  </g>

  <!-- Top Badges -->
  <rect x="24" y="24" width="auto" height="28" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1" />
  <text x="36" y="43" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5">WATER RESISTANT</text>

  <rect x="340" y="24" width="136" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.12" />
  <text x="408" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">5kg, 20kg, 40kg Bags</text>

  <!-- Central Technical Graphic -->
  <g transform="translate(250, 155)">
    <!-- Outer Glow Circle -->
    <circle r="72" fill="#FFFFFF" fill-opacity="0.05" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="2" />
    <circle r="56" fill="#000000" fill-opacity="0.2" />

    
        <!-- Wall Putty & Trowel -->
        <rect x="-26" y="-32" width="52" height="64" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2" />
        <path d="M-15 10 L15 10 L5 25 L-5 25 Z" fill="#F59E0B" />
        <text x="0" y="-2" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">PUTTY</text>
      
  </g>

  <!-- Bottom Details Card -->
  <rect x="20" y="250" width="460" height="110" rx="12" fill="#0F172A" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.1" />

  <text x="36" y="280" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="800">Polymer Wall Putty & Base Skim</text>
  <text x="36" y="304" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="500">White Cement-Based Interior & Exterior Wall Putty</text>

  <line x1="36" y1="322" x2="464" y2="322" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

  <circle cx="44" cy="340" r="4" fill="#F59E0B" />
  <text x="56" y="344" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="700">Leveling up to 5mm • Mirror Smooth</text>
  <text x="450" y="344" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="end">SRE MURUGAN SONS</text>
</svg>