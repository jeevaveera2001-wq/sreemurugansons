<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="500" height="380" rx="16" fill="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="76" x2="500" y2="76" />
    <line x1="0" y1="152" x2="500" y2="152" />
    <line x1="0" y1="228" x2="500" y2="228" />
    <line x1="0" y1="304" x2="500" y2="304" />
    <line x1="100" y1="0" x2="100" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
  </g>

  <!-- Top Badges -->
  <rect x="24" y="24" width="auto" height="28" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1" />
  <text x="36" y="43" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="bold" letter-spacing="0.5">NEUTRAL CURE SILICONE</text>

  <rect x="340" y="24" width="136" height="28" rx="6" fill="#FFFFFF" fill-opacity="0.12" />
  <text x="408" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Clear, White, Black</text>

  <!-- Central Technical Graphic -->
  <g transform="translate(250, 155)">
    <!-- Outer Glow Circle -->
    <circle r="72" fill="#FFFFFF" fill-opacity="0.05" stroke="#10B981" stroke-opacity="0.3" stroke-width="2" />
    <circle r="56" fill="#000000" fill-opacity="0.2" />

    
        <!-- Quality Shield -->
        <path d="M0 -30 L26 -16 L26 12 Q26 30 0 38 Q-26 30 -26 12 L-26 -16 Z" fill="#10B981" />
        <path d="M-8 4 L-2 10 L12 -6" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      
  </g>

  <!-- Bottom Details Card -->
  <rect x="20" y="250" width="460" height="110" rx="12" fill="#0F172A" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.1" />

  <text x="36" y="280" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="800">Silicone Sealants, Adhesives & Safety PPE</text>
  <text x="36" y="304" fill="#CBD5E1" font-family="sans-serif" font-size="12" font-weight="500">PU Expanding Foam, M-Seal Epoxy, N95, Gloves & Shoes</text>

  <line x1="36" y1="322" x2="464" y2="322" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />

  <circle cx="44" cy="340" r="4" fill="#10B981" />
  <text x="56" y="344" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">100% Silicone • High-Visibility Vests</text>
  <text x="450" y="344" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="end">SRE MURUGAN SONS</text>
</svg>